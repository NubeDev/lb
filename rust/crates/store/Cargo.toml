[package]
name = "lb-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
surrealdb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The boot memory guards log their (skipped pass / refused open) decisions at WARN with every
# number in the line — those are operator-facing events that must reach the node's telemetry sink,
# not just stderr (boot-memory-guard scope: "skipping is loud, never silent").
tracing.workspace = true
ulid.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The boot-guard suite asserts the SKIP IS LOUD on the real emitted warn line (not merely on the
# returned record), and stages a genuine pending `.merge/` with the same engine the store uses.
tracing-subscriber.workspace = true
# The SurrealQL parser, for `tests/surrealql_parses.rs` ONLY — it parses every query literal in the
# tree so a renamed function or changed syntax fails at `cargo test` rather than on first execution.
# `default-features = false` so this adds no feature to the copy `surrealdb` already pulls in: it is
# the same compiled crate, just linked into one test binary. Nothing outside that test may use it —
# all real queries go through the `Surreal<Db>` handle.
surrealdb-core = { version = "3", default-features = false }
