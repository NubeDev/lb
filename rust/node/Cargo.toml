# The `node` binary — wires the core crates together and selects roles by config (README §9).
# This is one of the two thin role-aware layers (§3.1): no core crate is role-aware, the role
# selection lives here. S1 runs solo.
[package]
# The package is `lb-node` (the embed scope's open-question resolution: a git-dep on a package called
# `node` is confusing). The BINARY stays `node` ([[bin]] below) and the LIB is `lb_node` ([lib] below).
name = "lb-node"
# Local override of the workspace version: the node binary's version keys the core-skill boot seeder
# (core.<name>@<version> — idempotent on (id, version)). Bump this when the embedded skill corpus
# changes so a restart re-seeds the new bodies instead of skipping them as no-ops.
version = "0.1.9"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The LIBRARY target: the supported embed API (`lb_node::{BootConfig, boot_full, RunningNode}`). An
# embedder git-deps `lb-node` and calls `boot_full`. `main.rs` is refactored onto this lib.
[lib]
name = "lb_node"
path = "src/lib.rs"

[[bin]]
name = "node"
path = "src/main.rs"

[dependencies]
# Boot-time diagnostics for the config-selected mail transport (`mail.rs`): "email is being DROPPED"
# has to be a real log line, not a comment.
tracing.workspace = true
lb-host.workspace = true
# The series-retention plane, for `BootConfig::retention_seed` (`seed_retention.rs`). A real
# dependency, not the dev-only one it used to be: provisioning a retention policy is now part of the
# boot ritual, because a policy that only an operator can apply is a policy that does not survive a
# rebuild (rubix-ai#84).
lb-ingest.workspace = true
lb-telemetry.workspace = true
# LAN discovery (`BootConfig::discovery`) — the mDNS bootstrap seam an embedder opts into.
lb-discovery.workspace = true
# `NodeId` for the discovery advertisement built in `from_env` at the binary boundary.
lb-bus.workspace = true
lb-store.workspace = true
lb-auth.workspace = true
lb-authz.workspace = true
lb-mcp.workspace = true
# The control-engine bridge role seeds one appliance via a `control-engine.appliance.add` MCP call at
# boot (env-gated in `main.rs`, §3.1) — it builds the JSON args with serde_json.
serde_json.workspace = true
# The native supervisor's `OsLauncher` — the federation role (datasources) installs + supervises the
# `federation` sidecar at boot, env-gated in `main.rs` (§3.1), exactly like the github roles below.
lb-supervisor.workspace = true
lb-role-gateway = { path = "../role/gateway" }
# The AI-gateway role (in-house model seam, default-agent-wiring). The node builds the real
# `AiGateway<Provider>` as the in-house `ModelAccess` from node config and installs it on the runtime
# registry (unconfigured → the honest `UnconfiguredModel`, symmetric on every node). NOT feature-gated:
# the in-house default agent is present on every node regardless of the external-agent feature.
lb-role-ai-gateway.workspace = true
# The external-agent role (external-agent topic, runtime-seam #1). OPTIONAL + behind the
# `external-agent` feature: a default `cargo build` does NOT compile it (nor its transitive
# `lb-external-agent`), so the OFF build carries none of the external-agent code — the compile-time
# optionality gate. Built with `cargo build -p lb-node --features external-agent`.
lb-role-external-agent = { workspace = true, optional = true }
anyhow.workspace = true
tokio.workspace = true

[dev-dependencies]
# The relay-boot test (`tests/relay_boot_test.rs`) reads the durable outbox rows directly — status,
# attempts, and the recorded failure reason — to prove an undeliverable email stays OWED rather than
# being acked away (issue #118). Test-only: the binary reaches the outbox through `lb-host`.
lb-outbox.workspace = true
# The embedder-credential-mode integration test drives the REAL gateway `boot_full` builds (its
# `router()` via a tower oneshot — no HTTP port), proving `BootConfig::credential_mode` reaches the
# gateway's login check. Same harness the gateway crate's route tests use (no mocks, testing §0).
tower = { version = "0.5", features = ["util"] }
axum = { workspace = true }
http-body-util = "0.1"

[features]
# OFF by default (runtime-seam-scope: "the `external-agent` cargo feature, OFF by default"). Turning
# it on pulls the role crate and lets the node register the external `AcpRuntime` entries into its
# runtime registry; off leaves a default-only registry with zero external surface.
default = []
external-agent = ["dep:lb-role-external-agent"]
# Forward the optional response cache (response-cache scope) to the host crate that owns it. OFF in
# lb's default features (embedders opt in — the `external-agent` precedent keeps the stock binary
# lean); a downstream host enables `lb-node/page-cache` in ITS defaults (rubix-ai does). Feature-off
# ⇒ no `moka`, a zero-cost no-op cache seam.
page-cache = ["lb-host/page-cache"]
# Forward the durable discovery profile (datasource-profile scope) to the host crate that owns it.
# OFF in lb's default features — embedders opt in, same posture as `page-cache`.
datasource-profile = ["lb-host/datasource-profile"]
