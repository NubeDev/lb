# CI — the S0 gate (STAGES.md): the FILE-LAYOUT size check + the test runner. Runs on every
# push and PR. Builds the host workspace and the wasm guest, then runs the tests.
name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  file-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FILE-LAYOUT size check (≤400 lines)
        run: bash rust/scripts/check-file-size.sh

  build-and-test:
    runs-on: ubuntu-latest
    env:
      # This workspace links polars + surrealdb + rusqlite into ~200 test binaries, and a debug
      # `cargo test --workspace` overran the runner's ~14 GB free disk. The failure did NOT look
      # like a disk failure — ld died with `signal 7 [Bus error]` (SIGBUS is what you get when a
      # writable mmap can't be backed by a block that no longer exists), and only one line further
      # up said `rustc-LLVM ERROR: IO failure on output stream: No space left on device`. It read
      # as a runner infra flake for weeks. These three knobs cut target/ by more than half:
      #   - no debug info at all in CI (backtraces aren't read here; the local `[profile.dev]`
      #     line-tables-only setting in rust/Cargo.toml still applies to developer machines),
      #   - no incremental artifacts, which a one-shot CI build never reuses.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      # Reclaim ~25 GB of preinstalled toolchains this job never touches (dotnet, GHC, Android
      # SDK, CodeQL bundles). Paired with the debug-info trim above, this is what keeps the link
      # step from running the disk to zero. Cheap: a few seconds of `rm`.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build the wasm guest (the S1 hello component)
        working-directory: rust/extensions/hello
        run: cargo build --target wasm32-wasip2 --release
      - name: Build the wasm guest v2 (the S2 hot-reload swap target)
        working-directory: rust/extensions/hello-v2
        run: cargo build --target wasm32-wasip2 --release
      - name: Build the host workspace
        working-directory: rust
        run: cargo build --workspace
      - name: Test
        working-directory: rust
        run: cargo test --workspace
      - name: Pack toolchain stays publishable
        # The stable published core (sign/key/trust-line) must build without `devkit-full`, and the
        # lb-pack dependency chain must stay publish-able — the gap that broke cc-app's `make dev`.
        working-directory: rust
        run: |
          cargo check -p lb-devkit --no-default-features
          cargo test -p lb-pack --test pack_verify_test
      - name: Format check
        working-directory: rust
        run: cargo fmt --all --check

  # Was `ui:` — it installed and tested `ui/`, the React shell DELETED in commit 678503f. It had
  # been failing at setup-node ("Some specified paths were not resolved") on a cache key pointing
  # at ui/pnpm-lock.yaml ever since, so the repo's frontend had NO CI coverage at all. lb's
  # frontend is now `packages/*` (the reusable libraries product hosts consume) plus `app/sdk`;
  # this job covers those, from the ROOT lockfile. Do not point this back at ui/ — see
  # CLAUDE.md § "Never recreate ui/".
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 11, not the 9 the old ui job pinned: pnpm-workspace.yaml uses keys that only pnpm 10+
          # understands (`allowBuilds`, `onlyBuiltDependencies`) and relies on pnpm 11's
          # minimumReleaseAge guard — which is why `overrides.electron-to-chromium` is pinned
          # there. Installing under 9 would validate a workspace nobody actually develops against.
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      # `!@nube/minimal-shell`: it declares `"@nube/ext-ui-sdk": "link:../../../lb-ext-ui-sdk"` — a
      # filesystem link to a SIBLING REPO CHECKOUT (NubeDev/lb-ext-ui-sdk) that exists only on a
      # developer box that cloned it next to lb. CI resolves it to nothing and vitest dies with
      # `Failed to resolve import "@nube/ext-ui-sdk"`. It is un-CI-able as wired, and it is the only
      # such package in the workspace. MIGRATION.md says lb should consume that SDK at a published
      # TAG (ui-v0.4.1), not a live link — switching it is a cross-repo release decision, not a CI
      # change, so this job skips the package and flags it rather than pretending it is covered.
      - name: Test (Vitest)
        run: pnpm -r --filter "./packages/*" --filter "!@nube/minimal-shell" run test
      # app/sdk's suite is `test:gateway` — it spawns a REAL node (rule 9, no fakes), so it needs
      # the Rust build and belongs with build-and-test, not here. Type-checking it is still a
      # real contract check against the generated client and costs nothing.
      - name: Type-check app/sdk
        working-directory: app/sdk
        run: pnpm typecheck

  deploy-image:
    # Proves the shared deploy image (deploy/common/Dockerfile — the SAME file local Docker and
    # `fly deploy` build) still builds on every PR. Build-only in v1: no push, no deploy from CI —
    # see docs/scope/deploy/fly-deploy-scope.md "CI: build-only or push?".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same disk headroom as build-and-test. Until now this job died at `COPY ui` within seconds
      # and never reached a compile, so it has NEVER actually exercised the release build of the
      # node + federation on a runner. Give it the room up front rather than discover the same
      # No-space-left-on-device the hard way.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift || true
          df -h /
      - name: Build deploy/common/Dockerfile
        run: docker build -f deploy/common/Dockerfile --tag lazybones:ci-deploy-check .
